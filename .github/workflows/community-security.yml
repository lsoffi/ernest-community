name: Community security

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 6 * * *'

permissions:
  contents: read

concurrency:
  group: community-security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1"
          --health-interval=10s --health-timeout=5s --health-retries=12
    env:
      DJANGO_DEBUG: '1'
      ACCOUNTS_ENABLED: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install MySQL build libraries
        run: sudo apt-get update && sudo apt-get install -y default-libmysqlclient-dev pkg-config
      - name: Install locked dependencies
        run: |
          python -m pip install --require-hashes -r requirements.txt
          python -m pip install --require-hashes -r requirements-tools.txt
          python -m pip check
      - name: Audit known vulnerabilities
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip --strict
      - name: Check schema and static assets
        run: |
          python manage.py makemigrations --check --dry-run
          python manage.py collectstatic --noinput
          node --check static/community/app.js
          node --check static/community/i18n.js
      - name: SQLite security tests
        run: python manage.py test community --settings=config.test_settings --noinput
      - name: MySQL security and concurrent-write tests
        env:
          COMMUNITY_TEST_MYSQL: '1'
        run: python manage.py test community --settings=config.test_settings --noinput
